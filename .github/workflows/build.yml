name: Build marble BakaSU GKI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git zip unzip wget curl ca-certificates

      - name: Clone marble kernel source
        run: |
          git clone --depth 1 -b marble-s-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: Apply BakaSU patch
        working-directory: kernel
        run: |
          curl -LSs https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh \
            | bash -s v4.2.0-rc3

      - name: Download AOSP clang r416183b
        run: |
          mkdir -p clang
          ok=0
          for i in 1 2 3; do
            if wget -q --timeout=90 \
              https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/clang-r416183b/clang-r416183b.tar.gz \
              -O clang.tgz; then ok=1; break; fi
            echo "download retry $i"; sleep 5
          done
          test "$ok" = 1
          tar -xzf clang.tgz -C clang
          clang/bin/clang --version | head -1

      - name: Configure kernel
        working-directory: kernel
        run: |
          export PATH="$PWD/../clang/bin:$PATH"
          make ARCH=arm64 O=out gki_defconfig
          ARCH=arm64 scripts/kconfig/merge_config.sh -O out -m \
            arch/arm64/configs/gki_defconfig \
            arch/arm64/configs/vendor/marble_GKI.config
          make ARCH=arm64 O=out olddefconfig
          grep 'CONFIG_KSU' out/.config || true

      - name: Build kernel Image
        working-directory: kernel
        run: |
          export PATH="$PWD/../clang/bin:$PATH"
          make ARCH=arm64 O=out -j"$(nproc)" \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            Image

      - name: Verify KSU built into kernel
        working-directory: kernel
        run: |
          stat -c '%n %s' out/arch/arm64/boot/Image
          if grep -aq 'kernelsu' out/arch/arm64/boot/Image; then
            echo "KSU strings FOUND in kernel: GKI built-in confirmed"
          else
            echo "ERROR: no kernelsu string in kernel"
            exit 1
          fi

      - name: Get AnyKernel3
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3

      - name: Write anykernel.sh
        run: |
          cat > ak3/anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          properties() { '
          kernel.string=BakaSU GKI for marble
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=marble
          device.name2=marblein
          '; }

          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          . tools/ak3-core.sh

          dump_boot

          write_boot
          EOF

      - name: Package AK3 zip
        run: |
          cp kernel/out/arch/arm64/boot/Image ak3/Image
          cd ak3
          zip -r9 ../marble-gki-bakasu.zip . -x '*.git*'
          cd ..
          unzip -t marble-gki-bakasu.zip | tail -3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: marble-gki-bakasu
          path: marble-gki-bakasu.zip
          retention-days: 14
